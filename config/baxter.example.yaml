# Baxter-Claw Configuration

# Driver configuration
driver:
  type: "mock"  # Options: "baxter" (real hardware) or "mock" (simulation)

# Robot configuration
robot:
  arms: ["right"]  # Currently supported: right arm only

# VLM (Vision-Language Model) configuration
vlm:
  enabled: false  # Set to true to enable vision features
  provider: "claude"  # Options: "claude", "openai"
  api_key: null  # Set API key here or use environment variable (ANTHROPIC_API_KEY or OPENAI_API_KEY)
  # api_key: "${ANTHROPIC_API_KEY}"  # Use environment variable

# Safety constraints
safety:
  # Workspace limits (meters)
  workspace:
    x: [0.3, 0.9]    # Forward reach from robot base
    y: [-0.7, 0.7]   # Lateral reach (negative = right side, positive = left side)
    z: [-0.2, 0.5]   # Height above table surface

  # Maximum speed ratio (0-1)
  max_speed: 0.5

# Primitive parameters
primitives:
  # Default approach height for pick/place (meters)
  approach_height: 0.1

  # Default grasp force (0-100)
  grasp_force: 30.0

  # Motion speed for primitives (0-1)
  default_speed: 0.3

# Server configuration
server:
  host: "0.0.0.0"
  port: 8420
